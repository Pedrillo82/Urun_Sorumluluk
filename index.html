<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Sorumluluk Sigortası Teklif Sistemi</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- PDF oluşturmak için jsPDF ve html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>Ürün Sorumluluk Sigortası</h1>
                <p>Teklif Hazırlama Sistemi</p>
            </div>
        </header>

        <!-- Ana Form -->
        <main class="main-content">
            <form id="teklifForm" class="teklif-form">
                <!-- Firma Bilgileri -->
                <section class="form-section">
                    <h2>Firma Bilgileri</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firmaAdi">Firma Adı</label>
                            <input type="text" id="firmaAdi" name="firmaAdi" required>
                        </div>
                        <div class="form-group">
                            <label for="vergiNo">Vergi No</label>
                            <input type="text" id="vergiNo" name="vergiNo" required>
                        </div>
                        <div class="form-group">
                            <label for="adres">Adres</label>
                            <textarea id="adres" name="adres" rows="2" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="telefon">Telefon</label>
                            <input type="tel" id="telefon" name="telefon" required>
                        </div>
                        <div class="form-group">
                            <label for="email">E-posta</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="yetkili">Yetkili Kişi</label>
                            <input type="text" id="yetkili" name="yetkili" required>
                        </div>
                    </div>
                </section>

                <!-- Ürün Bilgileri -->
                <section class="form-section">
                    <h2>Ürün Bilgileri</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="urunTuru">Ürün Türü</label>
                            <select id="urunTuru" name="urunTuru" required>
                                <option value="">Seçiniz</option>
                                <option value="gida">Gıda Ürünleri</option>
                                <option value="elektronik">Elektronik Ürünler</option>
                                <option value="kimyasal">Kimyasal Ürünler</option>
                                <option value="tekstil">Tekstil Ürünleri</option>
                                <option value="makine">Makine ve Ekipman</option>
                                <option value="otomotiv">Otomotiv Parçaları</option>
                                <option value="kozmetik">Kozmetik Ürünler</option>
                                <option value="medikal">Medikal Ürünler</option>
                                <option value="diger">Diğer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="urunAciklama">Ürün Açıklaması</label>
                            <textarea id="urunAciklama" name="urunAciklama" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="yillikCiro">Yıllık Ciro (TL)</label>
                            <input type="number" id="yillikCiro" name="yillikCiro" required>
                        </div>
                        <div class="form-group">
                            <label for="ihracatOrani">İhracat Oranı (%)</label>
                            <input type="number" id="ihracatOrani" name="ihracatOrani" min="0" max="100" value="0">
                        </div>
                    </div>
                </section>

                <!-- Teminat Bilgileri -->
                <section class="form-section">
                    <h2>Teminat Bilgileri</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="teminatLimiti">Teminat Limiti</label>
                            <select id="teminatLimiti" name="teminatLimiti" required>
                                <option value="">Seçiniz</option>
                                <option value="100000">100.000 TL</option>
                                <option value="250000">250.000 TL</option>
                                <option value="500000">500.000 TL</option>
                                <option value="1000000">1.000.000 TL</option>
                                <option value="2500000">2.500.000 TL</option>
                                <option value="5000000">5.000.000 TL</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="muafiyet">Muafiyet</label>
                            <select id="muafiyet" name="muafiyet" required>
                                <option value="">Seçiniz</option>
                                <option value="0">Muafiyet Yok</option>
                                <option value="1000">1.000 TL</option>
                                <option value="2500">2.500 TL</option>
                                <option value="5000">5.000 TL</option>
                                <option value="10000">10.000 TL</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="policeSuresi">Poliçe Süresi</label>
                            <select id="policeSuresi" name="policeSuresi" required>
                                <option value="1">1 Yıl</option>
                                <option value="2">2 Yıl</option>
                                <option value="3">3 Yıl</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="baslangicTarihi">Başlangıç Tarihi</label>
                            <input type="date" id="baslangicTarihi" name="baslangicTarihi" required>
                        </div>
                    </div>
                </section>

                <!-- Ek Teminatlar -->
                <section class="form-section">
                    <h2>Ek Teminatlar</h2>
                    <div class="checkbox-grid">
                        <div class="checkbox-group">
                            <input type="checkbox" id="geriCagirma" name="geriCagirma">
                            <label for="geriCagirma">Ürün Geri Çağırma</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="hukukiMasraf" name="hukukiMasraf">
                            <label for="hukukiMasraf">Hukuki Masraflar</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="itibarKoruma" name="itibarKoruma">
                            <label for="itibarKoruma">İtibar Koruma</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="cevreSorumluluk" name="cevreSorumluluk">
                            <label for="cevreSorumluluk">Çevre Sorumluluk</label>
                        </div>
                    </div>
                </section>

                <!-- Butonlar -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="formTemizle()">Temizle</button>
                    <button type="button" class="btn btn-primary" onclick="teklifHesapla()">Teklif Hesapla</button>
                </div>
            </form>

            <!-- Teklif Önizleme (PDF için) -->
            <div id="teklifOnizleme" class="teklif-onizleme" style="display: none;">
                <div class="onizleme-header">
                    <h2>Teklif Önizleme</h2>
                    <button type="button" class="btn btn-success" onclick="pdfOlustur()">PDF İndir</button>
                </div>
                <div id="pdfIcerik" class="pdf-icerik">
                    <!-- PDF içeriği JavaScript ile doldurulacak -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2025 Ürün Sorumluluk Sigortası Teklif Sistemi</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
